[package]
name = "younji"
description = "Client SSH / SFTP / RDP de bureau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "younji_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = ["isolation"] }

[dependencies]
# `isolation` : modèle d'isolation de l'IPC (ADR-015).
tauri = { version = "2.12.6", features = ["isolation"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
tracing-appender = "0.2.5"
core-ssh = { version = "0.1.0", path = "../crates/core-ssh" }
core-import = { version = "0.1.0", path = "../crates/core-import" }
core-rdp = { version = "0.1.0", path = "../crates/core-rdp" }
core-term = { version = "0.1.0", path = "../crates/core-term" }
core-vault = { version = "0.1.0", path = "../crates/core-vault" }
tauri-plugin-dialog = "2.8.4"
secrecy = { version = "0.10.3", features = ["serde"] }
tokio = { version = "1.54", features = ["sync", "time"] }
tempfile = "3"
open = "5.4.5"

[dev-dependencies]
rand = "0.10"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
