[workspace]
# Les crates métier rejoignent le workspace à leur étape (ARCHITECTURE.md §2).
members = ["src-tauri", "crates/core-import", "crates/core-rdp", "crates/core-ssh", "crates/core-term", "crates/core-vault"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/mlft9/younji"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pas de panique hors tests (AGENTS.md) ; autorisés dans les tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Argon2 (64 Mio, 3 passes) serait très lent sans optimisation : les tests du coffre et
# `npm run tauri dev` restent ainsi utilisables. Sans effet sur la compilation de production.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Génération de clés RSA 4096 (KEY-01) : quelques secondes sans optimisation. Même raison
# que pour Argon2 ; sans effet sur la compilation de production.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
